# ==============================================================================
# StockFlow Production Profile (application-prod.yml)
# ==============================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

stockflow:
  jwt:
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  reservation:
    worker-cron: ${RESERVATION_WORKER_CRON:*/30 * * * * *}
    ttl-minutes: ${RESERVATION_TTL_MINUTES:15}
  outbox:
    worker-cron: ${OUTBOX_WORKER_CRON:*/10 * * * * *}
    batch-size: ${OUTBOX_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
