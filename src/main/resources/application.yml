server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: stockflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:stockflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

stockflow:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  reservation:
    ttl-minutes: 15
    worker-cron: "*/30 * * * * *" # Every 30 seconds
  outbox:
    batch-size: 50
    worker-cron: "*/10 * * * * *" # Every 10 seconds
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:whsec_test_mock_secret_key_12345}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
