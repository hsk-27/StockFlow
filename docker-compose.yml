services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow_user
      POSTGRES_PASSWORD: stockflow_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow_user -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  stockflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/stockflow
      DB_USERNAME: stockflow_user
      DB_PASSWORD: stockflow_secure_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      PAYMENT_WEBHOOK_SECRET: whsec_test_mock_secret_key_12345
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
